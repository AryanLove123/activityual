[project]
name = "analytics-lambda"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "activityual-common",
    "boto3>=1.44.0",
]

[tool.uv.sources]
activityual-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
