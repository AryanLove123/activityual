[project]
name = "auth-service"
version = "0.1.0"
description = "Activityual authentication service"
requires-python = ">=3.11"
dependencies = [
    "activityual-common",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
activityual-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
