[project]
name = "activityual"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["backend/shared", "backend/services/*", "backend/lambdas/analytics", "backend/lambdas/recommendation"]

[tool.uv.sources]
activityual-common = { workspace = true }
auth-service = { workspace = true }
activity-service = { workspace = true }
tracking-service = { workspace = true }
analytics-lambda = { workspace = true }
recommendation-lambda = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "boto3>=1.44.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "moto[dynamodb,events,server,sqs]>=5.2.5",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
